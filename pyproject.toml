[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fittslawproject"
version = "0.1.0"
description = "A controlled horizontal Fitts' Law pointing experiment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pygame>=2.5,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[project.scripts]
fitts-experiment = "fitts.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "-q"
